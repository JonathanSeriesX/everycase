name: CI

on:
  push:
    branches: [master, main]
  pull_request:

# Static checks only — the full build (1,300+ prerendered pages, Postgres,
# Pagefind) stays Vercel's job. This catches type, lint and format breakage
# before a deploy does.
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm format:check
